<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 100" width="700" height="100">
  <defs>
    <style>
      @keyframes appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .letter { 
        opacity: 0; 
        animation: appear 0.3s ease forwards;
        font-family: Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>
  
  <!-- HABIT TRACKER -->
  <text x="50%" y="40" text-anchor="middle" font-size="42" font-weight="900" font-family="Arial">
    <tspan class="letter" style="fill:#ff00de; animation-delay:0.0s">H</tspan>
    <tspan class="letter" style="fill:#ff14d4; animation-delay:0.05s">A</tspan>
    <tspan class="letter" style="fill:#ff28ca; animation-delay:0.1s">B</tspan>
    <tspan class="letter" style="fill:#ff3cc0; animation-delay:0.15s">I</tspan>
    <tspan class="letter" style="fill:#ff50b6; animation-delay:0.2s">T</tspan>
    <tspan class="letter" style="fill:#ff64ac; animation-delay:0.25s"> </tspan>
    <tspan class="letter" style="fill:#ff78a2; animation-delay:0.3s">T</tspan>
    <tspan class="letter" style="fill:#ff8c98; animation-delay:0.35s">R</tspan>
    <tspan class="letter" style="fill:#ffa08e; animation-delay:0.4s">A</tspan>
    <tspan class="letter" style="fill:#ffb484; animation-delay:0.45s">C</tspan>
    <tspan class="letter" style="fill:#ffc87a; animation-delay:0.5s">K</tspan>
    <tspan class="letter" style="fill:#ffdc70; animation-delay:0.55s">E</tspan>
    <tspan class="letter" style="fill:#fff066; animation-delay:0.6s">R</tspan>
  </text>

  <!-- Отслеживай • Достигай • Побеждай -->
  <text x="50%" y="75" text-anchor="middle" font-size="18" font-weight="600" font-family="Arial">
    <tspan class="letter" style="fill:#00ffff; animation-delay:0.8s">О</tspan>
    <tspan class="letter" style="fill:#00e8ff; animation-delay:0.85s">т</tspan>
    <tspan class="letter" style="fill:#00d1ff; animation-delay:0.9s">с</tspan>
    <tspan class="letter" style="fill:#00baff; animation-delay:0.95s">л</tspan>
    <tspan class="letter" style="fill:#00a3ff; animation-delay:1.0s">е</tspan>
    <tspan class="letter" style="fill:#008cff; animation-delay:1.05s">ж</tspan>
    <tspan class="letter" style="fill:#0075ff; animation-delay:1.1s">и</tspan>
    <tspan class="letter" style="fill:#005eff; animation-delay:1.15s">в</tspan>
    <tspan class="letter" style="fill:#0047ff; animation-delay:1.2s">а</tspan>
    <tspan class="letter" style="fill:#0030ff; animation-delay:1.25s">й</tspan>
    <tspan class="letter" style="fill:#0030ff; animation-delay:1.3s"> </tspan>
    <tspan class="letter" style="fill:#0030ff; animation-delay:1.35s">•</tspan>
    <tspan class="letter" style="fill:#0030ff; animation-delay:1.4s"> </tspan>
    <tspan class="letter" style="fill:#0018ff; animation-delay:1.45s">Д</tspan>
    <tspan class="letter" style="fill:#0010ff; animation-delay:1.5s">о</tspan>
    <tspan class="letter" style="fill:#0008ff; animation-delay:1.55s">с</tspan>
    <tspan class="letter" style="fill:#0000ff; animation-delay:1.6s">т</tspan>
    <tspan class="letter" style="fill:#0800ff; animation-delay:1.65s">и</tspan>
    <tspan class="letter" style="fill:#1000ff; animation-delay:1.7s">г</tspan>
    <tspan class="letter" style="fill:#1800ff; animation-delay:1.75s">а</tspan>
    <tspan class="letter" style="fill:#2000ff; animation-delay:1.8s">й</tspan>
    <tspan class="letter" style="fill:#2000ff; animation-delay:1.85s"> </tspan>
    <tspan class="letter" style="fill:#2000ff; animation-delay:1.9s">•</tspan>
    <tspan class="letter" style="fill:#2000ff; animation-delay:1.95s"> </tspan>
    <tspan class="letter" style="fill:#2800ff; animation-delay:2.0s">П</tspan>
    <tspan class="letter" style="fill:#3000ff; animation-delay:2.05s">о</tspan>
    <tspan class="letter" style="fill:#3800ff; animation-delay:2.1s">б</tspan>
    <tspan class="letter" style="fill:#4000ff; animation-delay:2.15s">е</tspan>
    <tspan class="letter" style="fill:#4800ff; animation-delay:2.2s">ж</tspan>
    <tspan class="letter" style="fill:#5000ff; animation-delay:2.25s">д</tspan>
    <tspan class="letter" style="fill:#5800ff; animation-delay:2.3s">а</tspan>
    <tspan class="letter" style="fill:#6000ff; animation-delay:2.35s">й</tspan>
  </text>
</svg>
