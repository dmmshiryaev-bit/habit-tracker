<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 100" width="700" height="100">
  <defs>
    <style>
      @keyframes appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      tspan { 
        opacity: 0; 
        animation: appear 0.4s ease forwards; 
        font-family: 'Segoe UI', Arial, sans-serif; 
        font-weight: 700; 
      }
      .title { font-size: 46px; font-weight: 900; letter-spacing: 2px; }
      .subtitle { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
    </style>
  </defs>
  
  <!-- Строка 1: HABIT TRACKER -->
  <text y="45" text-anchor="middle" class="title">
    <tspan style="fill:#ff00de; animation-delay:0.0s">H</tspan>
    <tspan style="fill:#ff14d4; animation-delay:0.05s">A</tspan>
    <tspan style="fill:#ff28ca; animation-delay:0.1s">B</tspan>
    <tspan style="fill:#ff3cc0; animation-delay:0.15s">I</tspan>
    <tspan style="fill:#ff50b6; animation-delay:0.2s">T</tspan>
    <tspan style="fill:#ff64ac; animation-delay:0.25s"> </tspan>
    <tspan style="fill:#ff78a2; animation-delay:0.3s">T</tspan>
    <tspan style="fill:#ff8c98; animation-delay:0.35s">R</tspan>
    <tspan style="fill:#ffa08e; animation-delay:0.4s">A</tspan>
    <tspan style="fill:#ffb484; animation-delay:0.45s">C</tspan>
    <tspan style="fill:#ffc87a; animation-delay:0.5s">K</tspan>
    <tspan style="fill:#ffdc70; animation-delay:0.55s">E</tspan>
    <tspan style="fill:#fff066; animation-delay:0.6s">R</tspan>
  </text>

