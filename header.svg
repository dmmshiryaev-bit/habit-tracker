<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130">
  <defs>
    <!-- Мощное неоновое свечение для заголовка -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Лёгкое свечение для подзаголовка -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes appear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes colorShift {
        0% { fill: #ff00de; }
        25% { fill: #00ffff; }
        50% { fill: #ff00de; }
        75% { fill: #00ff88; }
        100% { fill: #ff00de; }
      }
      .letter {
        opacity: 0;
        animation: appear 0.4s ease forwards, colorShift 4s ease infinite;
        font-family: Arial, sans-serif;
        font-weight: 900;
        filter: url(#neonGlow);
      }
      .subtitle {
        opacity: 0;
        animation: appear 0.4s ease forwards;
        font-family: Arial, sans-serif;
        font-weight: 700;
        filter: url(#softGlow);
      }
    </style>
  </defs>

  <!-- HABIT TRACKER -->
  <text x="400" y="55" text-anchor="middle" font-size="42" letter-spacing="3">
    <tspan class="letter" style="animation-delay: 0.0s, 0.0s">H</tspan>
    <tspan class="letter" style="animation-delay: 0.05s, 0.05s">A</tspan>
    <tspan class="letter" style="animation-delay: 0.1s, 0.1s">B</tspan>
    <tspan class="letter" style="animation-delay: 0.15s, 0.15s">I</tspan>
    <tspan class="letter" style="animation-delay: 0.2s, 0.2s">T</tspan>
    <tspan class="letter" style="animation-delay: 0.25s, 0.25s"> </tspan>
    <tspan class="letter" style="animation-delay: 0.3s, 0.3s">T</tspan>
    <tspan class="letter" style="animation-delay: 0.35s, 0.35s">R</tspan>
    <tspan class="letter" style="animation-delay: 0.4s, 0.4s">A</tspan>
    <tspan class="letter" style="animation-delay: 0.45s, 0.45s">C</tspan>
    <tspan class="letter" style="animation-delay: 0.5s, 0.5s">K</tspan>
    <tspan class="letter" style="animation-delay: 0.55s, 0.55s">E</tspan>
    <tspan class="letter" style="animation-delay: 0.6s, 0.6s">R</tspan>
  </text>

  <!-- Подзаголовок с лёгким свечением -->
  <text x="400" y="100" text-anchor="middle" font-size="22" letter-spacing="2">
    <tspan class="subtitle" style="fill:#00ffff; animation-delay: 1.0s">⚡ Отслеживай</tspan>
    <tspan class="subtitle" style="fill:#ff00de; animation-delay: 1.2s"> • </tspan>
    <tspan class="subtitle" style="fill:#00ff88; animation-delay: 1.4s">Достигай</tspan>
    <tspan class="subtitle" style="fill:#ff00de; animation-delay: 1.6s"> • </tspan>
    <tspan class="subtitle" style="fill:#00ffff; animation-delay: 1.8s">Побеждай ⚡</tspan>
  </text>
</svg>
