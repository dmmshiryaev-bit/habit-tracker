  <text y="80" text-anchor="middle" class="subtitle">
    <tspan style="fill:#00ffff; animation-delay:0.8s">О</tspan>
    <tspan style="fill:#00f0f5; animation-delay:0.85s">т</tspan>
    <tspan style="fill:#00e1eb; animation-delay:0.9s">с</tspan>
    <tspan style="fill:#00d2e1; animation-delay:0.95s">л</tspan>
