    <tspan style="fill:#00699b; animation-delay:1.35s">•</tspan>
    <tspan style="fill:#00699b; animation-delay:1.4s"> </tspan>
    <tspan style="fill:#005a91; animation-delay:1.45s">Д</tspan>
    <tspan style="fill:#004b87; animation-delay:1.5s">о</tspan>
    <tspan style="fill:#003c7d; animation-delay:1.55s">с</tspan>
