<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130">
  <defs>
    <!-- Неоновое свечение только для заголовка -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes appear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes colorShift {
        0% { fill: #ff00de; }
        25% { fill: #00ffff; }
        50% { fill: #ff00de; }
        75% { fill: #00ff88; }
        100% { fill: #ff00de; }
      }
      .title-letter {
        opacity: 0;
        animation: appear 0.4s ease forwards, colorShift 4s ease infinite;
        font-family: Arial, sans-serif;
        font-weight: 900;
        filter: url(#neonGlow);
      }
      .subtitle-letter {
        opacity: 0;
        animation: appear 0.3s ease forwards;
        font-family: Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- HABIT TRACKER с неоновым свечением -->
  <text x="400" y="55" text-anchor="middle" font-size="42" letter-spacing="3">
    <tspan class="title-letter" style="animation-delay: 0.0s, 0.0s">H</tspan>
    <tspan class="title-letter" style="animation-delay: 0.05s, 0.05s">A</tspan>
    <tspan class="title-letter" style="animation-delay: 0.1s, 0.1s">B</tspan>
    <tspan class="title-letter" style="animation-delay: 0.15s, 0.15s">I</tspan>
    <tspan class="title-letter" style="animation-delay: 0.2s, 0.2s">T</tspan>
    <tspan class="title-letter" style="animation-delay: 0.25s, 0.25s"> </tspan>
    <tspan class="title-letter" style="animation-delay: 0.3s, 0.3s">T</tspan>
    <tspan class="title-letter" style="animation-delay: 0.35s, 0.35s">R</tspan>
    <tspan class="title-letter" style="animation-delay: 0.4s, 0.4s">A</tspan>
    <tspan class="title-letter" style="animation-delay: 0.45s, 0.45s">C</tspan>
    <tspan class="title-letter" style="animation-delay: 0.5s, 0.5s">K</tspan>
    <tspan class="title-letter" style="animation-delay: 0.55s, 0.55s">E</tspan>
    <tspan class="title-letter" style="animation-delay: 0.6s, 0.6s">R</tspan>
  </text>

  <!-- Подзаголовок с покадровым появлением букв -->
  <text x="400" y="100" text-anchor="middle" font-size="20" letter-spacing="1">
    <tspan class="subtitle-letter" style="fill:#00ffff; animation-delay:1.0s">О</tspan>
    <tspan class="subtitle-letter" style="fill:#00e8ff; animation-delay:1.05s">т</tspan>
    <tspan class="subtitle-letter" style="fill:#00d1ff; animation-delay:1.1s">с</tspan>
    <tspan class="subtitle-letter" style="fill:#00baff; animation-delay:1.15s">л</tspan>
    <tspan class="subtitle-letter" style="fill:#00a3ff; animation-delay:1.2s">е</tspan>
    <tspan class="subtitle-letter" style="fill:#008cff; animation-delay:1.25s">ж</tspan>
    <tspan class="subtitle-letter" style="fill:#0075ff; animation-delay:1.3s">и</tspan>
    <tspan class="subtitle-letter" style="fill:#005eff; animation-delay:1.35s">в</tspan>
    <tspan class="subtitle-letter" style="fill:#0047ff; animation-delay:1.4s">а</tspan>
    <tspan class="subtitle-letter" style="fill:#0030ff; animation-delay:1.45s">й</tspan>
    <tspan class="subtitle-letter" style="fill:#0030ff; animation-delay:1.5s"> </tspan>
    <tspan class="subtitle-letter" style="fill:#ff00de; animation-delay:1.55s">•</tspan>
    <tspan class="subtitle-letter" style="fill:#ff00de; animation-delay:1.6s"> </tspan>
    <tspan class="subtitle-letter" style="fill:#00ff88; animation-delay:1.65s">Д</tspan>
    <tspan class="subtitle-letter" style="fill:#00e87a; animation-delay:1.7s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#00d16c; animation-delay:1.75s">с</tspan>
    <tspan class="subtitle-letter" style="fill:#00ba5e; animation-delay:1.8s">т</tspan>
    <tspan class="subtitle-letter" style="fill:#00a350; animation-delay:1.85s">и</tspan>
    <tspan class="subtitle-letter" style="fill:#008c42; animation-delay:1.9s">г</tspan>
    <tspan class="subtitle-letter" style="fill:#007534; animation-delay:1.95s">а</tspan>
    <tspan class="subtitle-letter" style="fill:#005e26; animation-delay:2.0s">й</tspan>
    <tspan class="subtitle-letter" style="fill:#005e26; animation-delay:2.05s"> </tspan>
    <tspan class="subtitle-letter" style="fill:#ff00de; animation-delay:2.1s">•</tspan>
    <tspan class="subtitle-letter" style="fill:#ff00de; animation-delay:2.15s"> </tspan>
    <tspan class="subtitle-letter" style="fill:#ff6600; animation-delay:2.2s">П</tspan>
    <tspan class="subtitle-letter" style="fill:#ff5500; animation-delay:2.25s">о</tspan>
    <tspan class="subtitle-letter" style="fill:#ff4400; animation-delay:2.3s">б</tspan>
    <tspan class="subtitle-letter" style="fill:#ff3300; animation-delay:2.35s">е</tspan>
    <tspan class="subtitle-letter" style="fill:#ff2200; animation-delay:2.4s">ж</tspan>
    <tspan class="subtitle-letter" style="fill:#ff1100; animation-delay:2.45s">д</tspan>
    <tspan class="subtitle-letter" style="fill:#ff0000; animation-delay:2.5s">а</tspan>
    <tspan class="subtitle-letter" style="fill:#ee0000; animation-delay:2.55s">й</tspan>
  </text>
</svg>
